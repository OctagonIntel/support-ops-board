<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Ops Board</title>
<style>
:root{
  --page:#f4f5f7;--rail:#ffffff;--col:#ebedf0;--card:#ffffff;--card-hover:#fbfbfc;--overlay:#ffffff;
  --text:#2c3e5d;--strong:#172b4d;--subtle:#626f86;--subtlest:#8590a2;--border:#091e421f;--input:#ffffff;--input-border:#c1c7d0;
  --brand:#0c66e4;--brand-text:#ffffff;--link:#0c66e4;--hover:#091e420f;--selected:#e9f2ff;
  --float:0 1px 2px rgba(9,30,66,.10),0 4px 12px rgba(9,30,66,.08);
  --float-hover:0 2px 4px rgba(9,30,66,.10),0 12px 28px rgba(9,30,66,.14);
  --float-drag:0 20px 44px rgba(9,30,66,.28);
  --c-open:#2f6fe0;--c-client:#0f8b8d;--c-eng:#7357d6;--c-closed:#1f845a;
  --ok:#1f845a;--bad:#c9372c;--wait:#a5781b;--muted-dot:#8590a2;
  --v-client:#2f6fe0;--v-expected:#0f8b8d;--v-known:#ae4787;--v-new:#c9372c;--v-eng:#7357d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#161a1d;--rail:#1d2125;--col:#1d2125;--card:#2a3036;--card-hover:#2f363d;--overlay:#2a3036;
    --text:#b6c2cf;--strong:#dee4ea;--subtle:#9fadbc;--subtlest:#7d8a99;--border:#a6c5e21f;--input:#22272b;--input-border:#454f59;
    --brand:#579dff;--brand-text:#101214;--link:#79adff;--hover:#a1bdd914;--selected:#1c2b41;
    --float:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.28);
    --float-hover:0 2px 4px rgba(0,0,0,.4),0 14px 32px rgba(0,0,0,.42);
    --float-drag:0 24px 52px rgba(0,0,0,.6);
    --c-open:#579dff;--c-client:#5bc4c6;--c-eng:#9f8fef;--c-closed:#4bce97;
    --ok:#4bce97;--bad:#f87168;--wait:#e2b203;--muted-dot:#7d8a99;
    --v-client:#579dff;--v-expected:#5bc4c6;--v-known:#e774bb;--v-new:#f87168;--v-eng:#9f8fef;
  }
}
:root[data-theme="dark"]{
  --page:#161a1d;--rail:#1d2125;--col:#1d2125;--card:#2a3036;--card-hover:#2f363d;--overlay:#2a3036;
  --text:#b6c2cf;--strong:#dee4ea;--subtle:#9fadbc;--subtlest:#7d8a99;--border:#a6c5e21f;--input:#22272b;--input-border:#454f59;
  --brand:#579dff;--brand-text:#101214;--link:#79adff;--hover:#a1bdd914;--selected:#1c2b41;
  --float:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.28);--float-hover:0 2px 4px rgba(0,0,0,.4),0 14px 32px rgba(0,0,0,.42);--float-drag:0 24px 52px rgba(0,0,0,.6);
  --c-open:#579dff;--c-client:#5bc4c6;--c-eng:#9f8fef;--c-closed:#4bce97;
  --ok:#4bce97;--bad:#f87168;--wait:#e2b203;--muted-dot:#7d8a99;
  --v-client:#579dff;--v-expected:#5bc4c6;--v-known:#e774bb;--v-new:#f87168;--v-eng:#9f8fef;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font:14px/20px "Segoe UI",system-ui,-apple-system,sans-serif}
body.is-dragging{cursor:grabbing;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--link)}
svg{display:block;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--d);flex:none;display:inline-block}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;height:52px;padding:0 20px;background:var(--rail);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--strong);font-size:15px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:var(--brand-text);font-style:normal;font-size:13px;font-weight:700}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:0;background:var(--hover);color:var(--text);font-weight:500;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--text) 14%,transparent)}
.btn.primary{background:var(--brand);color:var(--brand-text);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.subtle{background:transparent}
.btn.subtle:hover{background:var(--hover)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.on{background:var(--selected);color:var(--link)}
.save{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--subtle);padding:0 4px 0 10px;height:32px;border-radius:6px;border:1px solid var(--border)}
.save .dot{--d:var(--muted-dot)}
.save.ok .dot{--d:var(--ok)}
.save.warn .dot{--d:var(--wait)}
.save .btn{height:24px;padding:0 8px;font-size:12px}

/* layout */
.page{max-width:1680px;margin:0 auto;padding:20px 20px 40px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.crumbs{color:var(--subtle);font-size:13px}
.crumbs span{margin:0 6px}
h1{font-size:24px;line-height:30px;font-weight:600;color:var(--strong);margin:2px 0 0}
.tabs{display:flex;gap:2px;background:var(--rail);border-radius:8px;padding:3px;box-shadow:var(--float)}
.tab{display:flex;align-items:center;gap:6px;background:none;border:0;padding:5px 12px;border-radius:6px;color:var(--subtle);font-weight:500}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--selected);color:var(--link)}
.tab .n{font-size:11px;background:var(--hover);border-radius:8px;padding:0 6px;color:var(--text)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:20px;align-items:start}
.rail{background:var(--rail);border-radius:12px;box-shadow:var(--float);padding:16px;position:sticky;top:16px}
.rail h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle);margin:0 0 10px;font-weight:600}
.rail h3:not(:first-child){margin-top:20px}
.big{font-size:34px;line-height:38px;font-weight:650;color:var(--strong);font-variant-numeric:tabular-nums}
.big small{font-size:13px;font-weight:500;color:var(--subtle);margin-left:6px}
.stat{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.stat b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--strong)}
.meter{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;margin:2px 0 6px 16px}
.meter span{display:block;height:100%;background:var(--d);border-radius:3px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0}
.kv span{color:var(--subtle)}
.kv b{color:var(--strong);font-weight:600;text-align:right}
.att{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;margin:0 -8px;width:calc(100% + 16px)}
.att:hover{background:var(--hover)}
.att .dot{margin-top:6px}
.att b{display:block;color:var(--strong);font-weight:500;font-size:13px}
.att small{display:block;color:var(--subtle);font-size:12px;line-height:16px}
.none{color:var(--subtlest);font-size:13px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.search{position:relative}
.search input{height:32px;width:220px;padding:0 8px 0 30px;border-radius:6px;border:1px solid var(--input-border);background:var(--input);color:var(--text);font:inherit}
.search input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.search svg{position:absolute;left:9px;top:9px;color:var(--subtle)}
.avatars{display:flex;gap:4px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;border:0;padding:0;flex:none}
.av.eu{background:#2f6fe0}.av.us{background:#7357d6}.av.unk{background:#626f86}
button.av{cursor:pointer;opacity:.75}
button.av:hover,button.av[aria-pressed="true"]{opacity:1}
button.av[aria-pressed="true"]{box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--brand)}
.caret::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin:-3px 0 0 4px}

/* floating menu (card ⋯, status, filters, columns) */
.pop{position:fixed;z-index:80;min-width:210px;background:var(--overlay);border-radius:8px;box-shadow:var(--float-drag);padding:6px;display:none;border:1px solid var(--border)}
.pop.open{display:block;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop .mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:6px;background:none;text-align:left;white-space:nowrap;color:var(--text)}
.pop .mi:hover,.pop .mi:focus-visible{background:var(--hover);outline:none}
.pop .mi.cur{color:var(--link);font-weight:600}
.pop .mi.cur::after{content:"✓";margin-left:auto}
.pop .mi.danger{color:var(--bad)}
.pop .mi:disabled{opacity:.4;cursor:default;background:none}
.pop .mi .count{margin-left:auto;color:var(--subtle);font-size:12px}
.pop .mi input{accent-color:var(--brand)}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 2px}
.pop .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--subtle);padding:4px 10px 2px}
.pop .sws{display:flex;gap:6px;padding:6px 10px}
.pop .sw{width:20px;height:20px;border-radius:50%;border:0;padding:0;background:var(--d)}
.pop .sw.cur{box-shadow:0 0 0 2px var(--overlay),0 0 0 4px var(--d)}

/* board */
.board-wrap{overflow-x:auto;padding:2px 2px 10px}
.board{display:flex;gap:14px;align-items:stretch;min-height:calc(100vh - 230px)}
.col{flex:1 1 0;min-width:230px;display:flex;flex-direction:column;background:var(--col);border-radius:12px;padding:0 10px 10px;transition:background .15s,box-shadow .15s}
.col.over{box-shadow:inset 0 0 0 2px var(--cc);background:color-mix(in srgb,var(--cc) 8%,var(--col))}
.colhead{display:flex;align-items:center;gap:8px;height:48px;padding:0 2px 0 4px;font-size:12px;font-weight:600;color:var(--subtle);text-transform:uppercase;letter-spacing:.04em}
.colhead .dot{--d:var(--cc)}
.colhead .cnt{color:var(--text);font-size:12px}
.colhead .btn.icon{width:28px;height:28px;opacity:0;transition:opacity .1s}
.col:hover .colhead .btn.icon,.colhead .btn.icon:focus-visible,.colhead .btn.icon.active{opacity:1}
.colhead input{font:inherit;text-transform:none;font-size:13px;height:28px;width:100%;padding:0 6px;border-radius:6px;border:2px solid var(--brand);background:var(--input);color:var(--text)}
.colbar{height:3px;border-radius:2px;background:var(--cc);opacity:.7;margin:-4px 4px 10px}
.cards{display:flex;flex-direction:column;gap:10px;flex:1}
.cards:has(.card) .empty{display:none}
.empty{color:var(--subtlest);font-size:12px;text-align:center;padding:18px 4px;border:1px dashed var(--border);border-radius:8px}
.col .create{display:flex;align-items:center;gap:6px;width:100%;height:32px;margin-top:10px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--subtle);font-weight:500;text-align:left}
.col .create:hover{background:var(--hover);color:var(--text)}
.side{display:flex;flex-direction:column;gap:10px;flex:0 0 52px}
.addcol{height:44px;border-radius:12px;border:0;background:var(--col);color:var(--subtle);font-size:20px}
.addcol:hover{color:var(--text);background:var(--hover)}
.closezone{flex:1;border-radius:12px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--subtle);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);gap:8px;transition:all .15s}
.closezone .dot{--d:var(--c-closed)}
body.is-dragging .closezone{border-color:var(--c-closed);color:var(--c-closed)}
.closezone.over{background:color-mix(in srgb,var(--c-closed) 14%,transparent);border-style:solid}

.card{position:relative;background:var(--card);border-radius:10px;box-shadow:var(--float);padding:12px 12px 10px 14px;cursor:grab;transition:transform .16s ease,box-shadow .16s ease,background .16s}
.card:hover{transform:translateY(-3px);box-shadow:var(--float-hover);background:var(--card-hover)}
.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.card.accent::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--ac)}
.card.placeholder{opacity:.3;box-shadow:none;transform:none;outline:2px dashed var(--brand);outline-offset:-2px}
.card.ghost{position:fixed;z-index:70;pointer-events:none;margin:0;transform:rotate(2.5deg) scale(1.03);box-shadow:var(--float-drag);cursor:grabbing;transition:none}
.card.landed{animation:land .3s ease}
@keyframes land{from{transform:scale(1.03);box-shadow:var(--float-drag)}to{transform:none}}
.card .t{color:var(--strong);font-weight:600;line-height:20px;padding-right:26px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kebab{position:absolute;top:8px;right:6px;width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--subtle);display:grid;place-items:center;opacity:0;transition:opacity .1s}
.card:hover .kebab,.kebab:focus-visible,.kebab.active{opacity:1}
.kebab:hover{background:var(--hover);color:var(--text)}
.vchip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--text);background:var(--hover);border-radius:6px;padding:2px 8px}
.vchip .dot{--d:var(--vc)}
.card .date{color:var(--subtle);font-size:12px;margin-top:8px}
.card .date.old{color:var(--bad)}
.card .sig{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--subtle);margin-top:6px;line-height:16px}
.card .sig .dot{--d:var(--sc);margin-top:4px}
.card .sig span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:10px;min-height:24px}
.card .foot>*{flex:none;white-space:nowrap}
.card .foot>.grow{flex:1 0 0}
.pts{min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--hover);color:var(--text);font-size:11px;font-weight:600;display:grid;place-items:center}
.key{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--subtle)}
.key a{color:inherit;text-decoration:none}
.key a:hover{color:var(--link);text-decoration:underline}
.key.done a,.key.done span{text-decoration:line-through}
.card .av{width:24px;height:24px;font-size:9px}
.pend{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--link);background:var(--selected);border-radius:4px;padding:0 5px;line-height:18px}
.cmt{font-size:12px;color:var(--subtle)}

/* closed page */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

/* list */
.listwrap{background:var(--rail);border-radius:12px;box-shadow:var(--float);overflow:auto}
.list{width:100%;border-collapse:collapse;font-size:14px}
.list th{text-align:left;font-size:12px;font-weight:600;color:var(--subtle);padding:10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
.list th:hover{color:var(--text)}
.list td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.list tr:last-child td{border-bottom:0}
.list tr.row{cursor:pointer}
.list tr.row:hover td{background:var(--hover)}
.list .sum{color:var(--strong);font-weight:500}
.spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sc);white-space:nowrap}
.spill .dot{--d:var(--sc)}

/* modals */
.modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(9,15,25,.22);align-items:flex-start;justify-content:center;padding:56px 16px}
.modal.on{display:flex}
.sheet{position:relative;background:color-mix(in srgb,var(--overlay) 80%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--border);border-radius:12px;box-shadow:var(--float-drag);width:min(1080px,100%);max-height:calc(100vh - 112px);display:flex;flex-direction:column;overflow:hidden;animation:pop .15s ease}
.sheet .details{background:color-mix(in srgb,var(--overlay) 55%,transparent)}
/* Jira-style field rows, shared by Create and the card view */
.jtype{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--strong);font-size:13px}
.jtype i{width:1px;height:16px;background:var(--border);margin:0 4px}
.sheet .jsum{width:100%;min-height:0;border:0;background:none;font:inherit;font-size:22px;line-height:28px;font-weight:600;color:var(--strong);padding:4px 6px;margin:0 -6px;border-radius:6px}
.sheet .jsum::placeholder{color:var(--subtlest)}
.sheet .jsum:hover{background:var(--hover)}
.sheet .jsum:focus{outline:2px solid var(--brand);outline-offset:0;background:var(--input)}
.jname{display:flex;gap:10px;align-items:center;margin-top:4px}
.jname .sep{color:var(--subtle);font-size:18px;font-weight:600}
.sheet .jdesc{width:100%;min-height:84px;resize:vertical;border:1px solid transparent;background:var(--hover);font:inherit;color:var(--text);border-radius:8px;padding:8px 10px;margin-top:10px}
.sheet .jdesc:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--input)}
.jgroup{margin-top:18px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle);border-bottom:1px solid var(--border);padding-bottom:6px}
.jrow{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;align-items:center;padding:5px 0}
.sheet .jrow>label,.jlab{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--subtle);font-weight:500;margin:0}
.jlab svg,.jrow>label svg,.details dt svg{color:var(--subtle);flex:none}
.sheet .jrow input,.sheet .jrow select{width:100%;font:inherit;color:var(--text);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;min-height:34px}
.sheet .jrow input:hover,.sheet .jrow select:hover{background:var(--hover)}
.sheet .jrow input:focus,.sheet .jrow select:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--input)}
.jrow select option{background:var(--overlay);color:var(--text)}
.jrow .static{display:flex;align-items:center;gap:8px;padding:5px 8px;color:var(--strong)}
.jrow .static .av{width:22px;height:22px;font-size:9px}
.jrow .err{grid-column:2;font-size:12px;color:var(--bad)}
.lchip{display:inline-flex;align-items:center;font-size:11.5px;line-height:18px;padding:0 7px;border-radius:4px;background:color-mix(in srgb,var(--link) 14%,transparent);color:var(--link);font-weight:500;white-space:nowrap}
.card .labels{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.sev{display:inline-flex;align-items:center;gap:6px}
.sev .dot{--d:var(--sv)}
.details dt{display:flex;align-items:center;gap:7px}
.details dl{grid-template-columns:136px 1fr}
.sheet.small{width:min(620px,100%)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:16px 20px 6px;color:var(--subtle);font-size:13px}
.sheet-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding:0 20px 22px;overflow-y:auto}
.sheet h2{font-size:22px;line-height:28px;color:var(--strong);margin:6px 0 12px;font-weight:600}
.statusbtn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:6px;border:0;font-weight:600;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc)}
.statusbtn .dot{--d:var(--cc)}
.sigbox{display:flex;gap:8px;align-items:flex-start;margin-top:12px;border-radius:8px;padding:9px 12px;font-size:13px;background:color-mix(in srgb,var(--sc) 12%,transparent)}
.sigbox .dot{--d:var(--sc);margin-top:6px}
.sigbox b{color:var(--sc)}
.sec{margin-top:20px}
.sec h4{font-size:13px;font-weight:600;color:var(--strong);margin:0 0 6px}
.sec p{margin:0}
.links{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.links li+li{border-top:1px solid var(--border)}
.links a{display:flex;align-items:center;gap:10px;padding:9px 12px;text-decoration:none;color:var(--text)}
.links a:hover{background:var(--hover)}
.links a b{font-weight:500;color:var(--link)}
.links a span{margin-left:auto;color:var(--subtle);font-size:12px}

    const r = drag.el.getBoundingClientRect();

    drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add("ghost");
    Object.assign(drag.ghost.style, {width: r.width + "px", left: r.left + "px", top: r.top + "px"});
    document.body.appendChild(drag.ghost); drag.el.classList.add("placeholder"); document.body.classList.add("is-dragging"); closePop();
  }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.dx) + "px"; drag.ghost.style.top = (e.clientY - drag.dy) + "px";
  const under = document.elementFromPoint(e.clientX, e.clientY);

/* ---------- wiki tab: the support-kit wiki, live and read-only, plus files for the agents ---------- */
let sa = null, saOk = false, wiki = null, srcFiles = null, wikiSel = "index.md", wikiQ = "", upCase = "";
const stemOf = c => c && c.file ? c.file.replace(/\.md$/, "") : "";
const caseOfFile = n => base.find(c => c.file && n.startsWith(stemOf(c) + "__"));
const shownName = n => { const c = caseOfFile(n); return c ? n.slice(stemOf(c).length + 2) : n; };
const fsize = b => b < 1024 ? b + " B" : b < 1048576 ? Math.round(b / 1024) + " KB" : (b / 1048576).toFixed(1) + " MB";
let saErr = "", wikiSkipped = 0;
const errText = e => (e && (e.name ? e.name + ": " : "") + (e.message || "")) || String(e);
async function saInit(){
  const h = await idbGet("sa"); if (!h) return;
  sa = h; try { saOk = (await h.queryPermission({mode:"readwrite"})) === "granted"; } catch (e) { saErr = "Couldn't check access: " + errText(e); }
  if (saOk) await loadWiki();
}
/* Picks (or re-picks) the support-kit folder. fresh = always open the picker. */
async function connectSA(fresh){
  saErr = "";
  try {
    let h = fresh ? null : sa;
    if (h) {
      let state = "denied";
      try { state = await h.requestPermission({mode:"readwrite"}); }
      catch (e) { h = null; saErr = "The saved folder can't be used any more (" + errText(e) + "). Pick it again."; }
      if (h && state !== "granted") { saOk = false; saErr = "Access wasn't allowed. Click again and choose Allow (or Edit files) in the browser box."; render(); return; }
    }
    if (!h) {
      h = await window.showDirectoryPicker({id:"support-kit", mode:"readwrite"});
      try { await h.getFileHandle("CLAUDE.md"); await h.getDirectoryHandle("wiki"); }
      catch { saErr = "That isn't the support-kit folder. Pick your support-kit folder (it holds CLAUDE.md and wiki)."; render(); return; }
      await idbSet("sa", h);
    }
    sa = h; saOk = true;
    await loadWiki();
    if (saOk) toast(`Wiki connected: ${wiki.pages.length} pages${wikiSkipped ? `, ${wikiSkipped} skipped` : ""}`);
  } catch (e) {
    if (e && e.name === "AbortError") saErr = "No folder picked.";
    else saErr = "Couldn't connect: " + errText(e);
  }
  render();
}
async function loadWiki(){
  const pages = []; wikiSkipped = 0;
  const walk = async (dir, pre) => {
    for await (const [n, h] of dir.entries()) {
      try {
        if (h.kind === "directory") await walk(h, pre + n + "/");
        else if (n.endsWith(".md")) {
          const text = await (await h.getFile()).text();
          const t = text.match(/^#\s+(.+)$/m);
          pages.push({path: pre + n, folder: pre.replace(/\/$/, ""), name: n, title: t ? t[1].trim() : n.replace(/\.md$/, ""), text});
        }
      } catch { wikiSkipped++; }
    }
  };
  try {
    await walk(await sa.getDirectoryHandle("wiki"), "");
  } catch (e) { saOk = false; wiki = null; saErr = "Couldn't read the wiki folder: " + errText(e); return; }
  pages.sort((a, b) => a.path.localeCompare(b.path));
  wiki = {pages, at: new Date()};
  try { await loadSources(); } catch (e) { srcFiles = []; saErr = "Wiki loaded, but the sources folder couldn't be read: " + errText(e); }
}
async function loadSources(){
  const d = await sa.getDirectoryHandle("sources", {create:true}), out = [];
  for await (const [n, h] of d.entries()) if (h.kind === "file" && n !== ".gitkeep" && n !== "README.md") { try { const f = await h.getFile(); out.push({name:n, size:f.size, at:f.lastModified}); } catch {} }
  srcFiles = out.sort((a, b) => b.at - a.at);
}
async function freeName(d, name){
  const dot = name.lastIndexOf("."), stem = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : "";
  for (let k = 1, cand = name; ; cand = `${stem} (${++k})${ext}`) { try { await d.getFileHandle(cand); } catch { return cand; } }
}
async function addFiles(list){
  if (wiki && wiki.demo) return toast("Demo mode: connect a support-kit folder to add files");
  if (!saOk) return toast("Connect the support-kit folder first");
  if (!list.length) return;
  try {
    const d = await sa.getDirectoryHandle("sources"), pre = upCase ? stemOf(byName(upCase)) : "";
    for (const f of list) {
      const name = await freeName(d, (pre ? pre + "__" : "") + f.name.replace(/[\\/:*?"<>|]/g, "_"));
      const w = await (await d.getFileHandle(name, {create:true})).createWritable(); await w.write(f); await w.close();
    }
    await loadSources(); render(); toast(`${list.length} file${list.length > 1 ? "s" : ""} added for the agents`);
  } catch { toast("Couldn't save the file. Try Connect again"); }
}
async function openSource(n){
  try {

/* [from, to, kind, what]: kind is read, manual (you do it by hand) or write. */
const MAP_EDGES = [
  ["intercom","investigate","read","the ticket"], ["slackc","investigate","read","the ticket"], ["slacki","investigate","read","past threads, DMs"], ["jira","investigate","read","past bugs"],

  ["investigate","reply","write","draft"], ["investigate","slackdraft","write","draft"], ["investigate","jirabug","manual","after \"file it\""], ["activity","report","write","Mondays"], ["wikiup","pr","manual","when you say share it"]
];
let mapPin = null;
function renderMap(){
  const W = 176, H = 50, GX = 206, GY = 12, TOP = 40, X0 = 8, rows = {};
  for (const n of MAP_NODES) n.r = rows[n.c] = (rows[n.c] ?? -1) + 1;
  const maxR = Math.max(...Object.values(rows)) + 1, total = maxR * (H + GY) - GY, svgH = TOP + total + 44;
  const cov = DATA.coverage || null, P = {};
  for (const n of MAP_NODES) P[n.id] = {x: X0 + n.c * GX, y: TOP + (total - ((rows[n.c] + 1) * (H + GY) - GY)) / 2 + n.r * (H + GY), n};
  const path = (a, b) => {
    if (b.n.c > a.n.c) { const sx = a.x + W, sy = a.y + H / 2, tx = b.x - 4, ty = b.y + H / 2, d = (tx - sx) / 2; return `M${sx},${sy} C${sx + d},${sy} ${tx - d},${ty} ${tx},${ty}`; }
    if (b.n.c === a.n.c) { const x = a.x + W / 2; return b.y > a.y ? `M${x},${a.y + H} L${x},${b.y - 4}` : `M${x},${a.y} L${x},${b.y + H + 4}`; }
    const low = svgH - 10; return `M${a.x + W / 2},${a.y + H} C${a.x + W / 2},${low} ${b.x + W / 2},${low} ${b.x + W / 2},${b.y + H + 4}`;
  };
  const covOf = n => cov && n.cov ? n.cov.reduce((s, k) => Math.max(s, cov.counts[k] || 0), 0) : 0;
  const svg = `<svg class="map" viewBox="0 0 ${X0 * 2 + 5 * GX + W} ${svgH}" role="img" aria-label="How the sources, the agent, the files and the board connect">
    <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L8,4 L0,8z"/></marker></defs>
    ${MAP_COLS.map((t, c) => `<text class="ch" x="${X0 + c * GX}" y="16">${esc(t)}</text>`).join("")}
    ${MAP_EDGES.map(([f, t, k], i) => `<path class="edge${k === "read" ? "" : " " + k}" data-edge="${i}" d="${path(P[f], P[t])}" marker-end="url(#ah)"/>`).join("")}
    ${MAP_NODES.map(n => { const {x, y} = P[n.id], cv = covOf(n);
      return `<g class="node${n.gap ? " gap" : ""}" data-node="${n.id}" transform="translate(${x},${y})" tabindex="0"><title>${esc(n.info)}</title><rect class="nr" width="${W}" height="${H}" rx="9"/>
        <text class="nl" x="12" y="21">${esc(n.label)}</text><text class="ns" x="12" y="38">${esc(n.sub)}</text>
        ${cv ? `<g class="nb"><rect x="${W - 44}" y="-9" width="50" height="18" rx="9"/><text x="${W - 19}" y="4" text-anchor="middle">${cv}/${cov.cases}</text></g>` : ""}</g>`; }).join("")}
  </svg>`;
  const top = cov ? Object.entries(cov.counts).sort((a, b) => b[1] - a[1]) : [];
  const COVL = {platform:"Platform", "monitor-code":"Monitor code", datadog:"Datadog", airflow:"Airflow", backoffice:"Admin sheet", screenshot:"Screenshot", intercom:"Intercom"};
  document.getElementById("view").innerHTML = `<div class="panel">
      <div class="mapbox">${svg}</div>
      <div class="legend"><span><i></i>Read automatically</span><span><i class="m"></i>You do it by hand</span><span><i class="w"></i>Written or sent</span><span><i class="g"></i>A gap: the agent can't reach it</span><span>Badge: cases where it couldn't check this</span></div>
    </div>
    <div class="mapgrid">
      <div class="panel minfo" id="mapInfo">${mapInfo(mapPin)}</div>
      <div class="panel cov"><h4>What the agent couldn't check</h4>
        ${cov ? `<p class="muted small" style="margin:0 0 8px">Across ${cov.cases} case files, as of ${fmt(cov.date)}.</p>${top.map(([k, n]) => `<div class="row"><span>${esc(COVL[k] || k)}</span><div class="bar"><span style="width:${n / cov.cases * 100}%"></span></div><b>${n}</b></div>`).join("")}` : `<p class="none">No numbers yet. The next check-up adds them.</p>`}
      </div>
    </div>`;
  const s = document.querySelector("svg.map");
  const focus = id => {
    s.classList.toggle("focus", !!id); s.querySelectorAll(".hi").forEach(x => x.classList.remove("hi"));
    if (!id) return;
    s.querySelector(`[data-node="${id}"]`).classList.add("hi");
    MAP_EDGES.forEach(([f, t], i) => { if (f === id || t === id) { s.querySelector(`[data-edge="${i}"]`).classList.add("hi"); s.querySelector(`[data-node="${f === id ? t : f}"]`).classList.add("hi"); } });
  };
  s.addEventListener("mouseover", e => { const g = e.target.closest("[data-node]"); if (g) focus(g.dataset.node); });
  s.addEventListener("mouseleave", () => focus(mapPin));
  s.addEventListener("click", e => { const g = e.target.closest("[data-node]"); mapPin = g && g.dataset.node !== mapPin ? g.dataset.node : null; focus(mapPin); document.getElementById("mapInfo").innerHTML = mapInfo(mapPin); });
  s.addEventListener("keydown", e => { const g = e.target.closest("[data-node]"); if (g && e.key === "Enter") g.dispatchEvent(new MouseEvent("click", {bubbles:true})); });
  focus(mapPin);
}
function mapInfo(id){
  const n = MAP_NODES.find(x => x.id === id), lab = x => MAP_NODES.find(m => m.id === x).label;
  if (!n) return `<h4>How it connects</h4><p class="muted" style="margin:0">Hover a box to see its links. Click one to keep it highlighted and read what it does.</p>`;
  const from = MAP_EDGES.filter(e => e[1] === id), to = MAP_EDGES.filter(e => e[0] === id);
  return `<h4>${esc(n.label)}</h4><p style="margin:0">${esc(n.info)}</p><dl>
    ${from.length ? `<dt>From</dt><dd>${from.map(e => `${esc(lab(e[0]))} <span class="muted">(${esc(e[3])}${e[2] === "manual" ? ", by hand" : ""})</span>`).join("<br>")}</dd>` : ""}
    ${to.length ? `<dt>To</dt><dd>${to.map(e => `${esc(lab(e[1]))} <span class="muted">(${esc(e[3])}${e[2] === "manual" ? ", by hand" : ""})</span>`).join("<br>")}</dd>` : ""}</dl>`;
}

  const groups = [

    ["Ready to close", "var(--ok)", open.filter(c => sig(c).signal === "solved"), c => sig(c).note],

/* ---------- ctrl+k: search cases, tickets, contacts and the wiki ---------- */
const kModal = document.getElementById("kModal"), kq = document.getElementById("kq"), kres = document.getElementById("kres");
let kSel = 0, kList = [];
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const hl = (s, words) => {
  const ws = words.filter(w => w.length > 1); s = String(s ?? "");
  if (!ws.length) return esc(s);
  return s.split(new RegExp("(" + ws.map(rxEsc).join("|") + ")", "ig")).map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join("");
};
function openK(){ closePop(); kModal.classList.add("on"); kq.value = ""; kSearch(); kq.focus(); }
function kSearch(){
  const words = kq.value.toLowerCase().split(/\s+/).filter(Boolean), all = items(), out = [];
  topicMatches(kq.value).slice(0, 6).forEach(t => out.push({kind:"topic", key:t.key, title:t.title, sub:t.sub}));
  const has = s => words.every(w => s.toLowerCase().includes(w));
  all.filter(c => { const d = detailsOf(c); return words.length ? has([c.case, ...(c.tickets || []), c.company_id, c.contact, c.monitor, c.region, VERDICT[c.verdict], c.col.label, d.summary, d.cause, d.next].join(" ")) : !c.isClosed; })
    .slice(0, words.length ? 8 : 6)
    .forEach(c => out.push({kind:"case", c, title:c.case, sub:[c.col.label, (c.tickets || []).join(", "), c.contact, c.company_id].filter(Boolean).join(" · ")}));
  if (wiki && words.length) wiki.pages.filter(p => has(p.title + " " + p.path + " " + p.text)).slice(0, 8).forEach(p => {
    const i = p.text.toLowerCase().indexOf(words[0]);
    const snip = i < 0 ? p.path : (i > 50 ? "…" : "") + p.text.slice(Math.max(0, i - 50), i + 100).replace(/[#*`|>\[\]]/g, "").replace(/\s+/g, " ").trim() + "…";
    out.push({kind:"wiki", p, title:p.title, sub:snip});
  });
  if (words.length) KB.map((it, i) => ({it, i})).filter(x => kbHit(x.it, words)).slice(0, 8)
    .forEach(({it, i}) => out.push({kind:"kb", i, title:it.title, sub:`${KBSRC[it.src]} · ${it.summary || it.path} · edited ${fmt(it.edited)}`}));
  [["board","Board"],["list","List"],["closed","Closed"],["wiki","Wiki"],["map","Map"]].filter(([v, t]) => !words.length || has(t + " tab")).forEach(([v, t]) => out.push({kind:"tab", v, title:"Go to " + t, sub:""}));
  kList = out; kSel = 0;
  const LBL = {topic:"Topics", case: words.length ? "Cases" : "Open cases", wiki:"Wiki", kb:"Notion and Help Center", tab:"Go to"};
  let last = "";
  kres.innerHTML = out.map((r, i) => { const head = r.kind !== last ? `<h6>${LBL[r.kind]}</h6>` : ""; last = r.kind;
    return `${head}<button class="kr${i === 0 ? " on" : ""}" data-k="${i}">${r.kind === "case" ? (r.c.kind === "task" ? ICON.task : (r.c.tickets || []).length ? ICON.bug : ICON.case) : r.kind === "wiki" || r.kind === "kb" ? ICON.link : `<span class="muted" style="width:16px;text-align:center">→</span>`}<span><b>${hl(r.title, words)}</b>${r.sub ? `<small>${hl(r.sub, words)}</small>` : ""}</span></button>`; }).join("")
    + (!out.length ? `<p class="none" style="padding:14px">Nothing matches.</p>` : "")
    + (!wiki && words.length ? `<div class="khint">The wiki isn't searched until you connect it on the Wiki tab.</div>` : "");
}
function kMove(d){ if (!kList.length) return; kSel = (kSel + d + kList.length) % kList.length; kres.querySelectorAll(".kr").forEach((b, i) => b.classList.toggle("on", i === kSel)); kres.querySelector(".kr.on")?.scrollIntoView({block:"nearest"}); }
function kGo(i){
  const r = kList[i]; if (!r) return; kModal.classList.remove("on");
  if (r.kind === "case") openCase(r.c.case);
  else if (r.kind === "wiki") { F.view = "wiki"; wikiSel = r.p.path; saveF(); render(); window.scrollTo(0, 0); }
  else if (r.kind === "topic") { F.view = "wiki"; wikiSel = r.key; saveF(); render(); window.scrollTo(0, 0); }
  else if (r.kind === "kb") { F.view = "wiki"; wikiSel = "kb:" + r.i; saveF(); render(); window.scrollTo(0, 0); }
  else { F.view = r.v; saveF(); render(); }
}
kq.addEventListener("input", kSearch);
kq.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); kMove(1); }
  if (e.key === "ArrowUp") { e.preventDefault(); kMove(-1); }
  if (e.key === "Enter") { e.preventDefault(); kGo(kSel); }
});
kres.addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) kGo(+b.dataset.k); });
document.getElementById("kBtn").onclick = openK;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (kModal.classList.contains("on")) closeModals(); else { closeModals(); openK(); } } });

/* ---------- copy changes (fallback) ---------- */
async function copyChanges(){
  const lines = ["Case board changes (" + today() + "), please apply:"];
  for (const c of items()) {
    if (c.pending) lines.push(`- New: ${c.case} | ${c.col.label} | opened ${c.opened}` + (c.region ? ` | ${c.region}` : "") + (c.tickets.length ? ` | ${c.tickets.join(", ")}` : "") + (c.source ? ` | ${c.source}` : "") + (c.note ? ` | ${c.note}` : ""));
    else if (c.moved) lines.push(c.isClosed ? `- Close out: ${c.case}` : `- Move: ${c.case} from ${STATUS_LABEL[c.status] || c.status} to ${STATUS_LABEL[c.col.status]}`);
  }
  for (const c of items()) {
    const f = edits.fields[c.case] || {};
    for (const k of c.fileEdits) lines.push(`- Edit ${c.case}: ${k} = ${Array.isArray(c[k]) ? c[k].join(", ") : c[k] || "(empty)"} (case file)`);
    for (const fd of FIELDS.filter(x => !x.file && x.k in f)) lines.push(`- Board field on ${c.case}: ${fd.label} = ${f[fd.k] || "(empty)"}`);
    for (const [k, v] of Object.entries(f.custom || {})) lines.push(`- Board field on ${c.case}: ${k} = ${v}`);
    if ("next" in f) lines.push(`- Next step on ${c.case}: ${f.next}`);
  }
  for (const n of newNotes()) lines.push(`- Comment on ${n.case}: ${n.text}`);
  for (const [n, list] of Object.entries(edits.memory)) for (const m of list) if (!DATA.notes_seen || m.at > DATA.notes_seen) lines.push(`- Memory note on ${n}: ${m.text}`);
  if (lines.length === 1) return toast("Nothing for the agent to apply");
  const text = lines.join("\n");
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into the chat."); }
  catch { prompt("Copy this and paste it into the chat:", text); }
}

let tt; function toast(m){ const t = document.getElementById("toast"); document.getElementById("toastText").textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
if (!["board","list","closed","wiki","map"].includes(F.view)) F.view = "board";

(() => {
  startDemo();
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("theme")) document.documentElement.dataset.theme = p.get("theme");
  if (p.get("view")) { F.view = p.get("view"); render(); }

  if (p.get("case")) openCase(p.get("case"));
  if (p.get("scroll")) setTimeout(() => document.querySelector("." + p.get("scroll"))?.scrollIntoView({block:"start"}), 0);
  if (p.get("search")) { openK(); kq.value = p.get("search"); kSearch(); }
})();
